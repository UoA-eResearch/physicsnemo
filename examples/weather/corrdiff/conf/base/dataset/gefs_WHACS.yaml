# Dataset type. Do not modify.
type: gefs_WHACS
# Directory containing GEFS NetCDF files (relative to examples/weather/corrdiff/)
gefs_dir: ../../../NZ_GEFS
# Directory containing WHACS subdirectories (relative to examples/weather/corrdiff/)
whacs_dir: ../../../WHACS
# Path to json stats file (relative to examples/weather/corrdiff/)
stats_path: ../../../GEFS_WHACS_stats.json
# Names of input channels (GEFS variables).
input_variables: ["swh", "dirpw", "perpw"]
# Names of output channels (WHACS variables).
output_variables: ["hs", "dir", "t01"]
# Target resolution for WHACS regridding (degrees)
target_resolution: 0.0625
# If true, center-crop target grid to nearest lower multiple of 16 (e.g., 244x240 -> 240x240)
crop_to_multiple_of_16: false
train: True
# Years to train the model.
train_years: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
# Years to validate the model.
valid_years: [2021, 2022, 2023]
